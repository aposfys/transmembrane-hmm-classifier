[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmclass"
version = "1.0.0"
description = "Profile-HMM classification of single-pass type I transmembrane proteins"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Apostolos Fysekidis" }]
keywords = ["bioinformatics", "hmmer", "profile-hmm", "transmembrane", "uniprot", "classification"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["biopython>=1.80", "numpy>=1.24"]

[project.optional-dependencies]
figures = ["matplotlib>=3.7"]
embeddings = ["torch>=2.2", "transformers>=4.40", "scikit-learn>=1.3", "numpy>=1.24"]
dev = ["pytest>=7.0", "matplotlib>=3.7", "scikit-learn>=1.3", "numpy>=1.24", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
tmclass = "tmclass.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The pinned UniProt snapshot ships with the package so the offline fallback
# works from an installed wheel, not just from a source checkout.
[tool.setuptools.package-data]
tmclass = ["snapshot/*.tsv.gz", "snapshot/MANIFEST.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.ruff]
line-length = 95
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # function calls in argument defaults are fine for argparse
    "RUF001",  # unicode in scientific strings (Å, ×, ≤) is deliberate
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]

[tool.mypy]
# No python_version pin: mypy follows the interpreter running it, so the
# CI matrix checks each supported version against its own dependency stubs.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["^tests/"]
